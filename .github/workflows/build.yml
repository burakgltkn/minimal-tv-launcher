name: Build Minimal TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build Signed Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password=minimaltv123 \
            -Pandroid.injected.signing.key.alias=minimal \
            -Pandroid.injected.signing.key.password=minimaltv123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minimal-tv-launcher
          path: app/build/outputs/apk/release/app-release.apk
