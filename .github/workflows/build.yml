name: Build Minimal TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare JKS Keystore
        run: |
          echo "${{ secrets.SIGNING_PEM_B64 }}" | base64 -d > combined.pem
          openssl pkcs12 -export -in combined.pem -inkey combined.pem -out temp.p12 -name minimal -passout pass:minimaltv123
          keytool -importkeystore \
            -srckeystore temp.p12 -srcstoretype PKCS12 -srcstorepass minimaltv123 \
            -destkeystore release.keystore -deststoretype JKS -deststorepass minimaltv123 \
            -noprompt

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password=minimaltv123 \
            -Pandroid.injected.signing.key.alias=minimal \
            -Pandroid.injected.signing.key.password=minimaltv123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minimal-tv-launcher
          path: app/build/outputs/apk/release/app-release.apk
